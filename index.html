<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Portes App</title>
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Portes App">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div id="title"></div>
  <button class="iconbtn" id="settingsBtn" aria-label="Mais"></button>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button data-tab="hoje" class="active" aria-label="Hoje"></button>
  <button data-tab="estudo" aria-label="Estudo"></button>
  <button data-tab="academia" aria-label="Academia"></button>
  <button data-tab="amigos" aria-label="Social"></button>
  <button data-tab="clube" aria-label="Clube do livro"></button>
  <button data-tab="galeria" aria-label="Galeria"></button>
</nav>

<div id="viewer" class="viewer" hidden></div>
<input type="file" id="mediaFile" accept="image/*,video/*" multiple hidden>
<input type="file" id="coverFile" accept="image/*" hidden>

<dialog id="goalDialog">
  <form method="dialog" id="goalForm">
    <h2 id="goalDialogTitle">Nova meta</h2>
    <label>Nome<input name="name" required placeholder="Ex.: Pacientes novos em novembro"></label>
    <div class="row2">
      <label>Atual<input name="current" type="number" inputmode="decimal" step="any" value="0"></label>
      <label>Alvo<input name="target" type="number" inputmode="decimal" step="any" required min="0.01"></label>
    </div>
    <div class="row2">
      <label>Unidade<input name="unit" placeholder="Ex.: pacientes, R$"></label>
      <label>Passo do +/−<input name="step" type="number" inputmode="decimal" step="any" value="1" min="0.01"></label>
    </div>
    <label>Prazo (opcional)<input name="deadline" type="date"></label>
    <div class="dialog-actions">
      <button type="button" class="btn danger" id="goalDelete">Apagar</button>
      <span class="spacer"></span>
      <button value="cancel" formnovalidate class="btn">Cancelar</button>
      <button value="save" class="btn primary">Salvar</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
